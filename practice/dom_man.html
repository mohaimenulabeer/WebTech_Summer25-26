<!DOCTYPE html>
<html>
<head>
    <title>DOM - Light/Dark Mode</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: white;
            color: black;
        }

        #switchBtn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 id="pageTitle">Light Mode</h1>

    <button id="switchBtn" onclick="toggleMode()">
        Switch to Dark Mode
    </button>

    <script>
        function toggleMode() {

            var body = document.body;
            var title = document.getElementById("pageTitle");
            var button = document.getElementById("switchBtn");

            if (body.style.backgroundColor == "black") {

                // Switch to Light Mode
                body.style.backgroundColor = "white";
                body.style.color = "black";

                title.innerHTML = "Light Mode";
                button.innerHTML = "Switch to Dark Mode";

            } else {

                // Switch to Dark Mode
                body.style.backgroundColor = "black";
                body.style.color = "white";

                title.innerHTML = "Dark Mode";
                button.innerHTML = "Switch to Light Mode";

            }
        }
    </script>

</body>
</html>
